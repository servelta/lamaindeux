name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations + seed automatically)
        run: supabase start

      - name: Write .env.test.local from the local Supabase stack's own output
        run: |
          supabase status -o env \
            | grep -E "^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)" \
            > /tmp/supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep API_URL /tmp/supabase.env | cut -d= -f2-)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep ANON_KEY /tmp/supabase.env | cut -d= -f2-)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep SERVICE_ROLE_KEY /tmp/supabase.env | cut -d= -f2-)"
          } > .env.test.local

      - name: Run unit tests
        run: npm run test

      - name: Run integration tests (against the local Supabase stack above)
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-not-used-at-build-time
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Stop Supabase
        if: always()
        run: supabase stop
